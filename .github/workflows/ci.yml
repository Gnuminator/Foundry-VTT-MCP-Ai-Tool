name: CI

# Once per pull request, plus every push to main (a push to a PR branch used to start a second,
# identical run).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same ref cancels the run still going for the old one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22: the release build. 24: what the Orange Pi runs (Foundry 14 requires Node 24,
        # and the bridge, dashboard and bot share that Node on the Pi).
        node: ['22', '24']
    name: build-test (Node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and lint (green-gate + warning ratchet)
        # Documented green-gate: a type/lint error that doesn't break the build
        # must still fail CI. Runs before build to fail fast. The lint ratchet
        # fails on any eslint error AND on any rule whose warning count rises
        # above scripts/lint-baseline.json (the count may only go down; lower it
        # with `npm run lint:ratchet -- --update`).
        run: npm run typecheck && npm run lint:ratchet && npm run emdash:ratchet && npm run version:check

      - name: Usage catalogue is current
        # shared/src/usage-catalog.generated.ts lists every control that reports usage
        # (docs/design/USAGE-LOG.md); regenerate with `npm run usage:catalog`.
        run: npm run usage:catalog:check

      - name: Docs lint and internal links
        # markdownlint (.markdownlint-cli2.jsonc) and every relative link and #anchor in the
        # tracked Markdown (scripts/check-links.mjs), I-081. docs/reference/tools.md is generated
        # from the tool catalog; the mcp-server tests fail while it is stale (`npm run docs:tools`).
        run: npm run docs:lint && npm run docs:links

      - name: Remote command guard
        # The Pi safety hook (.claude/hooks/guard-remote-commands.mjs) against the real stage scripts.
        run: node --test .claude/hooks/guard-remote-commands.test.mjs

      - name: Pi space check
        # The storage space check (stage 10, the nightly backup's pre-check, scripts/pi/space-check.ps1):
        # bash -n on the stage scripts, the checker's JSON against a fake df, the PC helper's levels
        # (the PowerShell part is skipped where pwsh 7 is missing).
        run: node --test scripts/pi/space-check.test.mjs

      - name: Pi backup copy record
        # PB-06: stage 6's record-pull.sh (bash -n, the file the bot reads) and the PC's
        # Send-PullRecord (record-pull.ps1; the PowerShell part is skipped where pwsh 7 is missing).
        run: node --test scripts/pi/backup-pull-record.test.mjs

      - name: Pi world bundle
        # push-world.ps1 and stage 11 (docs/dev/PI-SETUP.md, "Licensed content"): the asset path
        # scanner's pure functions (scripts/pi/world-refs.mjs) and bash -n on stage 11.
        run: node --test scripts/pi/world-refs.test.mjs

      - name: Changelog fragments
        # Each PR adds its CHANGELOG entry as a file in changelog.d/ (D-089); this checks the format.
        run: npm run changelog:check

      - name: Build (all workspaces)
        run: npm run build

      - name: Test kit engine tests
        # The test kit's engine and its fake (scripts/test-kit): needs the build, the fake reads the tool catalog from it.
        run: npm run kit:test

      - name: Project dashboard tests
        # The local developer dashboard (scripts/dev/project-dashboard): transcript scan, lanes, snapshot whitelist.
        run: npm run project-dashboard:test

      - name: Test kit scenario check
        # Every scenario file in scripts/test-kit/scenarios loads, validates and names only tools in tool-sets.ts.
        run: node scripts/test-kit/kit.mjs check

      - name: Test kit fake run
        # The whole kit (build, then every scenario) against the in-process fake: catches scenario and engine regressions without Foundry.
        run: node scripts/test-kit/kit.mjs all --fake
        env:
          TEST_KIT_HOME: ${{ runner.temp }}/test-kit

      - name: Unit tests (shared)
        # Parity + frozen-wire-contract guard for the @gnuminator/shared package.
        run: npm test -w @gnuminator/shared

      - name: Unit tests (foundry module)
        # Scoped to the module suite by workspace name (npm scope is @gnuminator/*).
        run: npm test -w @gnuminator/foundry-module

      - name: Unit tests (mcp-server)
        # Tool-layer + lock suites. vitest auto-runs once in CI (non-TTY).
        run: npm test -w @gnuminator/mcp-server

      - name: Unit tests (cogm-dashboard)
        # Player/GM split: auth role-resolution + server-side redaction.
        run: npm test -w @gnuminator/cogm-dashboard

      - name: Unit tests (discord-bot)
        # Recorder file format, Ogg writer and the silence-padding timeline.
        run: npm test -w @gnuminator/discord-bot

      - name: MCP schema smoke test
        run: node scripts/mcp-schema-smoke-test.mjs

      - name: Standalone bridge smoke test
        # Spawns the standalone entrypoint in control-only mode on a free port
        # (never 31414/31415/31416) and asserts ping + list_tools over the wire.
        run: node scripts/standalone-smoke-test.mjs

      - name: Player/GM split smoke test
        # Runs the dashboard against a mock bridge and asserts server-side
        # redaction (GM vs player) + the write-surface auth gate over HTTP.
        run: node scripts/cogm-split-smoke-test.mjs

      - name: Validate Foundry module manifest
        run: node scripts/validate-manifest.js

  build-test-arm:
    # The Orange Pi is ARM (aarch64) and runs Node 24: the same steps on an ARM runner
    # catch native-module or architecture problems before the tool moves there.
    runs-on: ubuntu-24.04-arm
    name: build-test (ARM, Node 24)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and lint (green-gate + warning ratchet)
        # Documented green-gate: a type/lint error that doesn't break the build
        # must still fail CI. Runs before build to fail fast. The lint ratchet
        # fails on any eslint error AND on any rule whose warning count rises
        # above scripts/lint-baseline.json (the count may only go down; lower it
        # with `npm run lint:ratchet -- --update`).
        run: npm run typecheck && npm run lint:ratchet && npm run emdash:ratchet && npm run version:check

      - name: Usage catalogue is current
        # shared/src/usage-catalog.generated.ts lists every control that reports usage
        # (docs/design/USAGE-LOG.md); regenerate with `npm run usage:catalog`.
        run: npm run usage:catalog:check

      - name: Docs lint and internal links
        # markdownlint (.markdownlint-cli2.jsonc) and every relative link and #anchor in the
        # tracked Markdown (scripts/check-links.mjs), I-081. docs/reference/tools.md is generated
        # from the tool catalog; the mcp-server tests fail while it is stale (`npm run docs:tools`).
        run: npm run docs:lint && npm run docs:links

      - name: Build (all workspaces)
        run: npm run build

      - name: Unit tests (shared)
        # Parity + frozen-wire-contract guard for the @gnuminator/shared package.
        run: npm test -w @gnuminator/shared

      - name: Unit tests (foundry module)
        # Scoped to the module suite by workspace name (npm scope is @gnuminator/*).
        run: npm test -w @gnuminator/foundry-module

      - name: Unit tests (mcp-server)
        # Tool-layer + lock suites. vitest auto-runs once in CI (non-TTY).
        run: npm test -w @gnuminator/mcp-server

      - name: Unit tests (cogm-dashboard)
        # Player/GM split: auth role-resolution + server-side redaction.
        run: npm test -w @gnuminator/cogm-dashboard

      - name: Unit tests (discord-bot)
        # Recorder file format, Ogg writer and the silence-padding timeline.
        run: npm test -w @gnuminator/discord-bot

      - name: MCP schema smoke test
        run: node scripts/mcp-schema-smoke-test.mjs

      - name: Standalone bridge smoke test
        # Spawns the standalone entrypoint in control-only mode on a free port
        # (never 31414/31415/31416) and asserts ping + list_tools over the wire.
        run: node scripts/standalone-smoke-test.mjs

      - name: Player/GM split smoke test
        # Runs the dashboard against a mock bridge and asserts server-side
        # redaction (GM vs player) + the write-surface auth gate over HTTP.
        run: node scripts/cogm-split-smoke-test.mjs

      - name: Validate Foundry module manifest
        run: node scripts/validate-manifest.js

name: CI

# Once per pull request, plus every push to main (a push to a PR branch used to start a second,
# identical run).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to a branch or PR ref cancels the run still going for the old one. A push to main gets
# a group of its own (its sha): a group holds one running and one pending run, and a third push
# cancels the pending one even without cancel-in-progress, so a shared group would still drop runs.
# Every merge commit gets a finished run, so a red cannot be hidden by the next merge (57 of 97 main
# runs were cancelled 2026-10-14 to 10-30). The repo is public, so the extra runner minutes, the ARM
# job included, are free.
# A hand-dispatched run (`npm run green -- --cloud` on a branch without a PR) names every job with a
# " [dispatch]" suffix. Its checks then have their own keys in a PR's check rollup, so the gate
# (latestChecks in scripts/lane-merge.mjs) never takes a dispatch run on the branch head for the
# pull_request run on the merge ref: a red merge-ref run stays visible next to a green dispatch. The
# other side: a red or cancelled "[dispatch]" check on the head blocks the gate on purpose; rerun that
# dispatch run (gh run rerun <id> --failed) or push again to clear it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Read-only token for every job: CI checks out and tests, it never writes to the repo
# (upload-artifact uses the runner's own artifact token, not GITHUB_TOKEN).
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    # Node 24 is the floor (decision 45): the release build, the installer, the Orange Pi and
    # Foundry 14 all run it. This is the one full x64 job, so the bundle budget, the zip upload
    # and the browser tests live here.
    name: build-test (Node 24)${{ github.event_name == 'workflow_dispatch' && ' [dispatch]' || '' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # One step per group of scripts/checks.mjs (CI_GROUPS), in order of dependence. A group runs
      # every check in it even after a red one, names each failure with an ::error line and writes
      # a table of checks and seconds to the job summary. Adding a test is one line in checks.mjs;
      # scripts/green.test.mjs fails on a test command written here instead.
      - name: Static checks and docs (typecheck, ratchets, version, catalogue, changelog, docs)
        run: node scripts/checks.mjs --run static

      - name: Scripts, hooks and the merge gate
        run: node scripts/checks.mjs --run scripts

      - name: Pi scripts
        run: node scripts/checks.mjs --run pi

      - name: Tools (skills, extension, recorder)
        run: node scripts/checks.mjs --run tools

      - name: Keep the GM coach zip
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: foundry-gm-coach
          path: tools/gm-coach/dist/foundry-gm-coach.zip
          retention-days: 30

      - name: Build and dashboard bundle budget
        run: node scripts/checks.mjs --run build

      - name: Test kit
        run: node scripts/checks.mjs --run kit

      - name: Unit tests (every workspace)
        run: node scripts/checks.mjs --run unit

      # The dashboard browser tests (Playwright) run in their own filtered, sharded jobs below
      # (dashboard-e2e-changes, dashboard-e2e-shard, dashboard-e2e).
      - name: Smoke tests and manifest
        run: node scripts/checks.mjs --run smoke

  studio-pin:
    # Downloads the Actor Studio release that Pi stage 13 pins and compares its sha256 with PINNED_SHA256, so a
    # typo in a pin fails here instead of on the Pi. About 7 MB, so it runs only when stage 13 or the check
    # itself changed (same plain-git diff as visual-changes: on a pull request the checkout is the merge
    # commit, and its first parent is the base). A push to main or a manual run always checks. The same check
    # by hand: npm run studio:pin-check. No npm ci: the script needs nothing installed.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: studio-pin (stage 13 checksum)${{ github.event_name == 'workflow_dispatch' && ' [dispatch]' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Did the stage 13 pin change?
        id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Not a pull request: check the pin."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only HEAD^1 HEAD)
          if echo "$changed" | grep -qE '^(scripts/pi/remote/13-player-creation\.sh|scripts/pi/check-studio-pin\.mjs|\.github/workflows/ci\.yml)$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Stage 13 did not change: skip the download."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pinned checksum matches the published release
        if: steps.filter.outputs.run == 'true'
        run: node scripts/pi/check-studio-pin.mjs

  visual-changes:
    # Decides whether dashboard-visual is worth its 5 minutes and image pull: only when the
    # dashboard package, the lockfile or this workflow changed. A job inside one workflow cannot
    # use `on.paths` (that would skip the whole workflow), so this job reads the diff itself, with
    # plain git and no third-party action. On a pull request the checkout is the merge commit, and
    # its first parent is the base branch. Anything that is not a pull request (push to main,
    # manual run) always runs the screenshots.
    runs-on: ubuntu-latest
    name: visual-changes (path filter)${{ github.event_name == 'workflow_dispatch' && ' [dispatch]' || '' }}
    outputs:
      run: ${{ steps.filter.outputs.run }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2

      - name: The shard list (VISUAL_SHARDS in scripts/checks.mjs)
        id: matrix
        run: |
          matrix=$(node scripts/checks.mjs --matrix visual)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      - name: Did the dashboard, the lockfile or this workflow change?
        id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Not a pull request: run the screenshots."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "Changed files against the base:"
          echo "$changed"
          if echo "$changed" | grep -qE '^(packages/cogm-dashboard/|package-lock\.json$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing the screenshots depend on changed: skip them."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  dashboard-visual-shard:
    # UI-01: page shots of the React dashboard and player pages (every moment and drawer, three
    # widths, neutral theme) are rendered and uploaded as the artifact dashboard-page-shots-N, not
    # compared (nothing is committed for them), plus an axe accessibility check (both themes), and
    # (UI-03) a compared shot and an axe check of every Storybook story, under
    # web/visual/__screenshots__/stories. The story baselines are Linux-only, made in this same
    # Playwright image (the image tag must be the installed @playwright/test version; the first
    # step checks it). It runs as 4 parallel shards (--shard=i/4; fullyParallel splits the tests
    # evenly by count; about 835 shots took 14 minutes in one job, the shards about 5). The summary
    # job below keeps one check under the old name `dashboard-visual (screenshots)` for people and
    # the lane skill; the gate judges every check, shards included. Not a required check in the ruleset, but a diff fails the job (no
    # continue-on-error) and the merge gate (scripts/lane-merge.mjs) refuses any check that is not
    # green, so a red dashboard-visual blocks the merge. The report with the diff images is kept as an artifact. Refresh the
    # baselines with `npm run test:visual:update -w @gnuminator/cogm-dashboard` (Docker; see the
    # dashboard README).
    needs: visual-changes
    if: needs.visual-changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    name: dashboard-visual shard ${{ matrix.shard }}/4${{ github.event_name == 'workflow_dispatch' && ' [dispatch]' || '' }}
    strategy:
      # Every shard reports, so one red shard does not hide another's diffs.
      fail-fast: false
      matrix: ${{ fromJSON(needs.visual-changes.outputs.matrix) }}
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    env:
      # Playwright's browsers read HOME; a container job runs as root.
      HOME: /root
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        # HUSKY=0: the git hook setup of the root `prepare` script is not needed here.
        run: npm ci
        env:
          HUSKY: '0'

      - name: The image matches the installed Playwright
        # A Playwright bump changes the image tag above; a mismatch means the wrong browser build.
        run: |
          installed=$(node -p "require('@playwright/test/package.json').version")
          image="1.64.0"
          if [ "$installed" != "$image" ]; then
            echo "Installed @playwright/test is $installed but the job image is v$image-noble. Update the image tag in .github/workflows/ci.yml (and rebuild the baselines)."
            exit 1
          fi

      - name: Build the dashboard
        run: |
          npm run build:shared
          npm run build -w @gnuminator/cogm-dashboard

      - name: Build Storybook
        # UI-03: the story shots (and their axe check) photograph every story of the built
        # Storybook, so it is built before them.
        run: npm run build-storybook -w @gnuminator/cogm-dashboard

      - name: Screenshot tests and axe
        run: npm run test:visual:ci -w @gnuminator/cogm-dashboard -- --shard=${{ matrix.shard }}/4

      - name: Keep the page shots
        # The full-page shots of this shard, for the reviewer to look at (not compared with
        # anything). Kept even when a story shot fails.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dashboard-page-shots-${{ matrix.shard }}
          path: packages/cogm-dashboard/page-shots
          if-no-files-found: warn
          retention-days: 14

      - name: Keep the visual report
        # The HTML report and the diff images (expected, actual, diff) of a failed run.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dashboard-visual-report-${{ matrix.shard }}
          path: |
            packages/cogm-dashboard/playwright-report/visual
            packages/cogm-dashboard/test-results/visual
          retention-days: 14

  dashboard-visual:
    # One summary check under the old name: green when every shard passed or the path filter
    # skipped them (a skipped check counts as green in scripts/lane-merge.mjs), red when a shard
    # failed or was cancelled. !cancelled() so it still runs, and fails, after a red shard.
    needs: [visual-changes, dashboard-visual-shard]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    name: dashboard-visual (screenshots)${{ github.event_name == 'workflow_dispatch' && ' [dispatch]' || '' }}
    steps:
      - name: Every shard passed, or was skipped by the filter
        run: |
          echo "visual-changes: ${{ needs.visual-changes.result }}"
          echo "shards: ${{ needs.dashboard-visual-shard.result }}"
          if [ "${{ needs.visual-changes.result }}" != "success" ]; then
            echo "The path filter did not finish."
            exit 1
          fi
          case "${{ needs.dashboard-visual-shard.result }}" in
            success|skipped) ;;
            *) echo "A visual shard failed or was cancelled: see the dashboard-visual-report-N artifacts."; exit 1 ;;
          esac

  dashboard-e2e-changes:
    # Decides whether the dashboard browser tests are worth their minutes: only when the dashboard,
    # shared, the lockfile, the Chromium install script or this workflow changed. Same plain-git
    # filter as visual-changes (on a pull request the checkout is the merge commit, its first
    # parent is the base); a push to main and a manual run always run them. The patterns are pinned
    # by scripts/ci-e2e-filter.test.mjs: the specs import only from the dashboard and shared.
    runs-on: ubuntu-latest
    name: dashboard-e2e-changes (path filter)${{ github.event_name == 'workflow_dispatch' && ' [dispatch]' || '' }}
    timeout-minutes: 10
    outputs:
      run: ${{ steps.filter.outputs.run }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2

      - name: The shard list (E2E_SHARDS in scripts/checks.mjs)
        id: matrix
        run: |
          matrix=$(node scripts/checks.mjs --matrix e2e)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      - name: Did the dashboard, shared or their tooling change?
        id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Not a pull request: run the dashboard browser tests."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git -c core.quotePath=false diff --name-only --no-renames HEAD^1 HEAD)
          echo "Changed files against the base:"
          echo "$changed"
          if echo "$changed" | grep -qE '^(packages/cogm-dashboard/|shared/|docs/(gm|foundry|da/gm)/|scripts/(tsc7|check-links|ci-install-chromium)\.(mjs|sh)$|package\.json$|package-lock\.json$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing the dashboard browser tests depend on changed: skip them."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  dashboard-e2e-shard:
    # Playwright against the built dashboard at /next/ (packages/cogm-dashboard/web, D-109): the real
    # server with no bridge, the /api routes faked in the browser. Three parallel shards
    # (--shard=i/3; fullyParallel splits the tests evenly by count). The summary job below is the
    # single check people look at; the gate judges every check, shards included.
    needs: dashboard-e2e-changes
    if: needs.dashboard-e2e-changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    name: dashboard-e2e shard ${{ matrix.shard }}/3${{ github.event_name == 'workflow_dispatch' && ' [dispatch]' || '' }}
    timeout-minutes: 20
    strategy:
      # Every shard reports, so one red shard does not hide another's failures.
      fail-fast: false
      matrix: ${{ fromJSON(needs.dashboard-e2e-changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        # HUSKY=0: the git hook setup of the root `prepare` script is not needed here.
        run: npm ci
        env:
          HUSKY: '0'

      - name: Build the dashboard
        run: |
          npm run build:shared
          npm run build -w @gnuminator/cogm-dashboard

      - name: Cache Playwright's browser download
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium for the dashboard browser tests
        # Retries the apt/browser install on a runner DNS blip; see the script.
        timeout-minutes: 30
        run: bash scripts/ci-install-chromium.sh

      - name: Dashboard browser tests (React dashboard)
        run: npm run test:e2e -w @gnuminator/cogm-dashboard -- --shard=${{ matrix.shard }}/3

      - name: Keep the browser test report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dashboard-playwright-report-${{ matrix.shard }}
          path: |
            packages/cogm-dashboard/playwright-report
            packages/cogm-dashboard/test-results
          retention-days: 14

  dashboard-e2e:
    # One summary check: green when every shard passed or the path filter skipped them (a skipped
    # check counts as green in scripts/lane-merge.mjs), red when a shard failed or was cancelled.
    # !cancelled() so it still runs, and fails, after a red shard. Same shape as dashboard-visual.
    needs: [dashboard-e2e-changes, dashboard-e2e-shard]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    name: dashboard-e2e (browser tests)${{ github.event_name == 'workflow_dispatch' && ' [dispatch]' || '' }}
    timeout-minutes: 5
    steps:
      - name: Every shard passed, or was skipped by the filter
        run: |
          echo "dashboard-e2e-changes: ${{ needs.dashboard-e2e-changes.result }}"
          echo "shards: ${{ needs.dashboard-e2e-shard.result }}"
          if [ "${{ needs.dashboard-e2e-changes.result }}" != "success" ]; then
            echo "The path filter did not finish."
            exit 1
          fi
          case "${{ needs.dashboard-e2e-shard.result }}" in
            success|skipped) ;;
            *) echo "A browser test shard failed or was cancelled: see the dashboard-playwright-report-N artifacts."; exit 1 ;;
          esac

  python-tests:
    # The Python tools under tools/ (narration, session notes, session pipeline, transcriber), D-109.
    # Their unit tests need only pytest, numpy and ffmpeg: the model packages (faster-whisper,
    # ctranslate2, torch, chatterbox) are imported lazily, and fakes stand in for the models and
    # for claude -p. Every tools/<name>/ with a pyproject.toml and a tests/ folder runs, so a new
    # tool is picked up without editing this job.
    runs-on: ubuntu-latest
    name: python-tests (Python 3.12)${{ github.event_name == 'workflow_dispatch' && ' [dispatch]' || '' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install pytest, numpy and ffmpeg
        # ffmpeg: the narration render tests skip without it, so a slow apt mirror must not
        # hang the job: the install is bounded and a failure only skips those tests.
        timeout-minutes: 8
        run: |
          python -m pip install --quiet 'pytest>=8' numpy
          # timeout waits on apt-get itself (through sudo), so -k can send the SIGKILL
          apt_opts="-o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=0"
          command -v ffmpeg || { sudo timeout -k 20 120 apt-get update -q $apt_opts && sudo timeout -k 20 180 apt-get install -y -q $apt_opts --no-install-recommends ffmpeg; } || echo "::warning::ffmpeg not installed: the narration render tests will skip"

      - name: Unit tests (tools/*)
        run: |
          status=0
          ran=0
          for dir in tools/*/; do
            [ -f "$dir/pyproject.toml" ] && [ -d "$dir/tests" ] || continue
            echo "::group::$dir"
            (cd "$dir" && python -m pytest -p no:cacheprovider -rs) || status=1
            echo "::endgroup::"
            ran=$((ran + 1))
          done
          [ "$ran" -gt 0 ] || { echo "No Python test folders found under tools/"; exit 1; }
          exit $status

  build-test-arm:
    # The Orange Pi is ARM (aarch64) and runs Node 24: the same steps on an ARM runner
    # catch native-module or architecture problems before the tool moves there.
    # The Pi container tests are the pi-container matrix; the job build-test-arm-summary at the end
    # of this file reports the required check `build-test (ARM, Node 24)` for both.
    runs-on: ubuntu-24.04-arm
    name: build-test-arm (steps)${{ github.event_name == 'workflow_dispatch' && ' [dispatch]' || '' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The ARM checks are the named group `arm` of scripts/checks.mjs (NAMED_GROUPS): usage
      # catalogue (stays on purpose, a few seconds, guards the generated file the build imports),
      # build, the unit tests of the five packages, the Pi cut-over guard in an ARM64 container, the
      # three smoke tests and the manifest check.
      # The Pi container tests (Debian 13 ARM64, scripts/pi/container-test/*-scenarios.sh) are the
      # `pi-container` matrix job below, not steps here.
      - name: ARM checks
        run: node scripts/checks.mjs --run arm

  pi-changes:
    # Decides whether the Pi container tests are worth their minutes: only when something they mount
    # or read changed. Same plain-git filter as visual-changes (on a pull request the checkout is the
    # merge commit, its first parent is the base). A push to main and a manual run always run them.
    # The patterns are pinned by scripts/pi/ci-pi-filter.test.mjs: every path the container tests
    # mount or read must match one, so a new input cannot slip past the filter.
    runs-on: ubuntu-latest
    name: pi-changes (path filter)${{ github.event_name == 'workflow_dispatch' && ' [dispatch]' || '' }}
    timeout-minutes: 10
    outputs:
      run: ${{ steps.filter.outputs.run }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2

      - name: The matrix of Pi container tests (PI_CONTAINER_MATRIX in scripts/checks.mjs)
        id: matrix
        run: |
          matrix=$(node scripts/checks.mjs --matrix pi)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      - name: Did a Pi input change?
        id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Not a pull request: run the Pi container tests."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git -c core.quotePath=false diff --name-only --no-renames HEAD^1 HEAD)
          echo "Changed files against the base:"
          echo "$changed"
          if echo "$changed" | grep -qE '^(scripts/pi/|scripts/plan-b/|scripts/gamenight-watch|scripts/checks\.mjs$|deploy/|package-lock\.json$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing the Pi container tests depend on changed: skip them."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  pi-container:
    # One shard per container test (scripts/pi/*.test.mjs with its PI_*_CONTAINER switch, which runs
    # scripts/pi/container-test/*-scenarios.sh in Debian 13 ARM64 with stand-ins for systemd). They
    # run in parallel and only when pi-changes says so. A new scenario is one line in the matrix; the
    # `build-test (ARM, Node 24)` summary below goes red when any shard fails or is cancelled.
    needs: pi-changes
    if: needs.pi-changes.outputs.run == 'true'
    runs-on: ubuntu-24.04-arm
    name: pi-container (${{ matrix.name }})${{ github.event_name == 'workflow_dispatch' && ' [dispatch]' || '' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.pi-changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: ${{ matrix.name }} in an ARM64 container
        run: ${{ matrix.env }}=1 node --test scripts/pi/${{ matrix.test }}

  build-test-arm-summary:
    # The required check keeps its old name, `build-test (ARM, Node 24)` (the ruleset names it):
    # green when the ARM steps passed and every Pi container shard passed or was skipped by the
    # filter, red when either failed or was cancelled. !cancelled() so it still runs, and fails,
    # after a red job. Same shape as dashboard-visual.
    needs: [build-test-arm, pi-changes, pi-container]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    name: build-test (ARM, Node 24)${{ github.event_name == 'workflow_dispatch' && ' [dispatch]' || '' }}
    timeout-minutes: 5
    steps:
      - name: The ARM steps passed, and so did every Pi container shard (or the filter skipped them)
        run: |
          echo "build-test-arm: ${{ needs.build-test-arm.result }}"
          echo "pi-changes: ${{ needs.pi-changes.result }}"
          echo "pi-container: ${{ needs.pi-container.result }}"
          if [ "${{ needs.build-test-arm.result }}" != "success" ]; then
            echo "The ARM build and tests did not pass."
            exit 1
          fi
          if [ "${{ needs.pi-changes.result }}" != "success" ]; then
            echo "The Pi path filter did not finish."
            exit 1
          fi
          case "${{ needs.pi-container.result }}" in
            success|skipped) ;;
            *) echo "A Pi container shard failed or was cancelled: see the pi-container jobs."; exit 1 ;;
          esac

name: Mutation core

# Mutation score of the safety core (guarded writes), once a week. A run takes a long time, so it
# lives here and not in ci.yml. It fails when the score drops below scripts/mutation-baseline.json;
# to raise the floor after a run that scored higher, run `npm run mutation:core -- --update` and
# commit the baseline.
on:
  schedule:
    - cron: '23 4 * * 0' # Sundays 04:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation-core:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Mutation score against the baseline
        run: npm run mutation:core

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-core-report
          path: reports/mutation/mutation.json
          if-no-files-found: ignore
          retention-days: 30

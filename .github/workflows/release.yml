name: Release

# The one release workflow. Push a tag `vX.Y.Z` (it must match the root package.json version) and
# this builds and publishes, under that tag's own download links:
#   - module.json                     Foundry manifest whose manifest/download URLs point at this tag
#   - foundry-mcp-bridge.zip          the Foundry module with its built code
#   - foundry-mcp-server-vX.Y.Z.zip   the standalone bridge (bundled Node server)
#   - FoundryMCPServer-Setup-vX.Y.Z.exe   the Windows client installer (Node.js + MCP client + Claude Desktop entries)
#   - foundry-ai-tool-obsidian.zip    the Obsidian companion plugin (a foundry-ai-tool folder)
# workflow_dispatch runs the same build as a dry run (artifacts only, no release is created).
#
# Nothing is posted to foundryvtt.com: the package id `foundry-mcp-bridge` belongs to the upstream
# project, so this fork is installed from the manifest URL of a GitHub release only.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}

jobs:
  verify:
    name: verify (version, types, lint, build, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: One version number (root package.json, tag and every stamped file agree)
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            node scripts/sync-version.mjs --check --tag "${{ github.ref_name }}"
          else
            node scripts/sync-version.mjs --check
          fi

      - name: Typecheck and lint
        run: npm run typecheck && npm run lint:ratchet

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Validate Foundry module manifest
        run: node scripts/validate-manifest.js

  module:
    name: module zip and manifest
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Work out the tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "TAG=${{ github.ref_name }}" >> "$GITHUB_ENV"
          else
            echo "TAG=v$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          fi

      - name: Build the module
        run: npm run build:shared && npm run build:foundry

      - name: Write the manifest for this tag
        run: node scripts/sync-version.mjs --release-manifest "$TAG" build/module.json

      - name: Package the module
        # The zip is named foundry-mcp-bridge.zip and has module.json at the archive root (Foundry
        # extracts it into modules/foundry-mcp-bridge itself; a wrapping folder would break that).
        run: |
          set -e
          mkdir -p build/foundry-mcp-bridge
          cp build/module.json build/foundry-mcp-bridge/module.json
          cp -r packages/foundry-module/dist build/foundry-mcp-bridge/
          for d in lang styles templates; do
            if [ -d "packages/foundry-module/$d" ]; then
              cp -r "packages/foundry-module/$d" build/foundry-mcp-bridge/
            fi
          done
          find build/foundry-mcp-bridge/dist -type f \( -name '*.map' -o -name '*.d.ts' \) -delete
          test -f build/foundry-mcp-bridge/dist/main.js
          (cd build/foundry-mcp-bridge && zip -r ../foundry-mcp-bridge.zip . >/dev/null)
          unzip -l build/foundry-mcp-bridge.zip | grep -q ' module.json$'
          ls -lh build/foundry-mcp-bridge.zip build/module.json

      - name: Package the Obsidian plugin
        # One folder, foundry-ai-tool, that goes into <vault>/.obsidian/plugins/ (or use
        # scripts/install-obsidian-plugin.ps1 -From <zip>).
        run: |
          set -e
          npm run build -w @gnuminator/obsidian-plugin
          mkdir -p build/obsidian/foundry-ai-tool
          cp packages/obsidian-plugin/dist/main.js packages/obsidian-plugin/dist/manifest.json             packages/obsidian-plugin/dist/styles.css packages/obsidian-plugin/dist/FONT-LICENSES.txt             build/obsidian/foundry-ai-tool/
          # The theme as CSS snippets for a vault without the plugin (the player vault).
          mkdir -p build/obsidian/snippets
          cp packages/obsidian-plugin/dist/snippets/*.css packages/obsidian-plugin/dist/FONT-LICENSES.txt             build/obsidian/snippets/
          (cd build/obsidian && zip -r ../foundry-ai-tool-obsidian.zip foundry-ai-tool snippets >/dev/null)
          unzip -l build/foundry-ai-tool-obsidian.zip | grep -q 'foundry-ai-tool/manifest.json$'
          ls -lh build/foundry-ai-tool-obsidian.zip

      - uses: actions/upload-artifact@v4
        with:
          name: release-module
          path: |
            build/module.json
            build/foundry-mcp-bridge.zip
            build/foundry-ai-tool-obsidian.zip
          retention-days: 30

  bridge:
    name: standalone bridge zip
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Work out the tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "TAG=${{ github.ref_name }}" >> "$GITHUB_ENV"
          else
            echo "TAG=v$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          fi

      - name: Build the bundled bridge
        run: npm run build:shared && npm run bundle:server

      - name: Package the standalone bridge
        run: |
          set -e
          mkdir -p standalone-mcp-server
          cp packages/mcp-server/dist/index.bundle.cjs standalone-mcp-server/index.js
          VERSION="${TAG#v}"
          printf '{\n  "name": "foundry-mcp-server",\n  "version": "%s",\n  "description": "Foundry AI Tool bridge, standalone installation",\n  "main": "index.js",\n  "scripts": { "start": "node index.js" },\n  "engines": { "node": ">=18.0.0" }\n}\n' "$VERSION" > standalone-mcp-server/package.json
          {
            echo "# Foundry AI Tool bridge, manual installation"
            echo ""
            echo "Requirements: Node.js 18 or later, and the Foundry AI Tool module in Foundry VTT."
            echo ""
            echo "1. Extract this ZIP where you want to keep it."
            echo "2. Run: node index.js"
            echo "3. Add it to Claude Desktop (see claude_desktop_config.example.json in the repository)."
            echo ""
            echo "Documentation: ${RELEASE_REPO_URL}"
            echo "Version: ${TAG}"
          } > standalone-mcp-server/README.md
          zip -r "foundry-mcp-server-${TAG}.zip" standalone-mcp-server >/dev/null
          ls -lh "foundry-mcp-server-${TAG}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: release-bridge
          path: foundry-mcp-server-${{ env.TAG }}.zip
          retention-days: 30

  installer:
    name: Windows installer
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Work out the tag
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } else {
            $tag = "v" + (Get-Content package.json -Raw | ConvertFrom-Json).version
          }
          "TAG=$tag" >> $env:GITHUB_ENV

      - name: Build the bundled bridge
        run: npm run build:shared && npm run bundle:server

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build the installer
        shell: pwsh
        run: |
          $env:PATH = "C:\Program Files (x86)\NSIS;$env:PATH"
          Set-Location installer
          node build-nsis.js --version $env:TAG

      - name: Check the installer exists
        shell: pwsh
        run: |
          $exe = "installer/build/FoundryMCPServer-Setup-$env:TAG.exe"
          if (-not (Test-Path $exe)) { Write-Error "Installer not found: $exe"; exit 1 }
          "{0:N1} MB" -f ((Get-Item $exe).Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: release-installer
          path: installer/build/FoundryMCPServer-Setup-${{ env.TAG }}.exe
          retention-days: 30

  publish:
    name: publish GitHub release
    needs: [module, bridge, installer]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-files

      - name: List the release files
        run: ls -lh release-files

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Foundry AI Tool ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            release-files/module.json
            release-files/foundry-mcp-bridge.zip
            release-files/foundry-ai-tool-obsidian.zip
            release-files/foundry-mcp-server-${{ github.ref_name }}.zip
            release-files/FoundryMCPServer-Setup-${{ github.ref_name }}.exe
          body: |
            ## Foundry AI Tool ${{ github.ref_name }}

            For Foundry VTT 14 with D&D 5e (dnd5e 6).

            **Windows:** download `FoundryMCPServer-Setup-${{ github.ref_name }}.exe` and run it. It installs
            the bridge, offers to install the Foundry module and sets up Claude Desktop.

            **Foundry module only:** in Foundry, Install Module, paste this manifest URL:
            `${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/module.json`

            **Manual bridge:** download `foundry-mcp-server-${{ github.ref_name }}.zip` and run it with Node 18 or later.

            **Obsidian plugin (optional, desktop):** unzip `foundry-ai-tool-obsidian.zip` into your vault's `.obsidian/plugins/` folder, then turn on "Foundry AI Tool" under Community plugins.

            Documentation: ${{ github.server_url }}/${{ github.repository }}

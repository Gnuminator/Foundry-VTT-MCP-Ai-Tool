name: visual-baselines

# Makes the dashboard screenshot baselines for a branch BEFORE its pull request, so the first PR run
# of dashboard-visual is green. Start it with `npm run visual:baselines -- <branch>` (it dispatches
# this workflow from main, waits, and unpacks the artifact). It renders the screens and the story
# shots with --update-snapshots in the same Playwright image as dashboard-visual in ci.yml, and
# uploads only the PNGs that changed or are new. It never commits or pushes (read-only token): the
# lane looks at the images and commits them itself. Keep the image tag in step with ci.yml.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to render the screenshots for'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: visual-baselines-${{ inputs.branch }}
  cancel-in-progress: true

jobs:
  baselines:
    runs-on: ubuntu-latest
    name: visual-baselines
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    env:
      # Playwright's browsers read HOME; a container job runs as root.
      HOME: /root
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Mark the checkout safe for git
        # The container runs as root on a runner-owned checkout.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: '0'

      - name: The image matches the installed Playwright
        run: |
          installed=$(node -p "require('@playwright/test/package.json').version")
          image="1.64.0"
          if [ "$installed" != "$image" ]; then
            echo "Installed @playwright/test is $installed but the job image is v$image-noble. Update the image tag here and in ci.yml."
            exit 1
          fi

      - name: Build the dashboard
        run: |
          npm run build:shared
          npm run build -w @gnuminator/cogm-dashboard

      - name: Build Storybook
        run: npm run build-storybook -w @gnuminator/cogm-dashboard

      - name: Render the baselines
        # An axe finding fails Playwright but not the rendering: the baselines are still written,
        # and axe is judged by dashboard-visual on the PR.
        run: npm run test:visual:ci -w @gnuminator/cogm-dashboard -- --update-snapshots || echo "Playwright exited non-zero (axe or a test); baselines were still written."

      - name: Collect the changed and new PNGs
        run: |
          dir=packages/cogm-dashboard/web/visual/__screenshots__
          mkdir -p baseline-out
          git status --porcelain --untracked-files=all -- "$dir" | grep -E '\.png$' > baseline-out/changed.txt || true
          cat baseline-out/changed.txt
          # Deleted files are listed but not copied (removing a story's baseline is the lane's call).
          sed -E 's/^...//' baseline-out/changed.txt | while read -r f; do
            if [ -f "$f" ]; then
              mkdir -p "baseline-out/$(dirname "$f")"
              cp "$f" "baseline-out/$f"
            fi
          done

      - name: Keep the baselines
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: baseline-out
          retention-days: 7
          if-no-files-found: error

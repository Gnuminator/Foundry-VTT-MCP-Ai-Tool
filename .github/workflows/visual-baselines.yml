name: visual-baselines

# Makes the dashboard screenshot baselines for a branch BEFORE its pull request, so the first PR run
# of dashboard-visual is green. Start it with `npm run visual:baselines -- <branch>` (it dispatches
# this workflow ON the branch, waits, and unpacks the artifact), so the branch must contain this
# file: cut it from main after this workflow merged, or merge main into it. It runs on the branch
# itself, not on main, so branch code never runs with main's cache access (CodeQL
# actions/cache-poisoning). It renders the screens and the story
# shots with --update-snapshots in the same Playwright image as dashboard-visual in ci.yml, and
# uploads only the PNGs that changed or are new. It never commits or pushes (read-only token): the
# lane looks at the images and commits them itself. Keep the image tag in step with ci.yml.

on:
  workflow_dispatch:
    inputs:
      nonce:
        description: 'Set by npm run visual:baselines so it can find its own run'
        required: false
        default: ''
        type: string

run-name: visual-baselines ${{ github.ref_name }} ${{ inputs.nonce }}

permissions:
  contents: read

concurrency:
  group: visual-baselines-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baselines:
    runs-on: ubuntu-latest
    name: visual-baselines
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    env:
      # Playwright's browsers read HOME; a container job runs as root.
      HOME: /root
    steps:
      - uses: actions/checkout@v4

      - name: Mark the checkout safe for git
        # The container runs as root on a runner-owned checkout.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/setup-node@v4
        with:
          # No npm cache: this job runs a branch's code, and a cache it writes could poison the
          # cache the main-branch jobs read (CodeQL actions/cache-poisoning).
          node-version: '22'

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: '0'

      - name: The image matches the installed Playwright
        run: |
          installed=$(node -p "require('@playwright/test/package.json').version")
          image="1.64.0"
          if [ "$installed" != "$image" ]; then
            echo "Installed @playwright/test is $installed but the job image is v$image-noble. Update the image tag here and in ci.yml."
            exit 1
          fi

      - name: Build the dashboard
        run: |
          npm run build:shared
          npm run build -w @gnuminator/cogm-dashboard

      - name: Build Storybook
        run: npm run build-storybook -w @gnuminator/cogm-dashboard

      - name: Render the baselines
        # An axe finding fails Playwright but not the rendering: the baselines are still written,
        # and axe is judged by dashboard-visual on the PR. The exit code goes into the artifact so
        # npm run visual:baselines can say when nothing rendered.
        run: |
          mkdir -p baseline-out
          code=0
          npm run test:visual:ci -w @gnuminator/cogm-dashboard -- --update-snapshots || code=$?
          echo "$code" > baseline-out/playwright-exit.txt
          git rev-parse HEAD > baseline-out/head.txt

      - name: Collect the changed and new PNGs
        run: |
          dir=packages/cogm-dashboard/web/visual/__screenshots__
          mkdir -p baseline-out
          # -z: names with quotes or non-ASCII characters arrive unquoted. Deleted files are not
          # copied (removing a story's baseline is the lane's call).
          git status --porcelain -z --untracked-files=all -- "$dir" | while IFS= read -r -d '' entry; do
            f="${entry:3}"
            case "$f" in *.png) ;; *) continue ;; esac
            echo "$entry"
            if [ -f "$f" ]; then
              mkdir -p "baseline-out/$(dirname "$f")"
              cp "$f" "baseline-out/$f"
            fi
          done

      - name: Keep the baselines
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: baseline-out
          retention-days: 7
          if-no-files-found: error

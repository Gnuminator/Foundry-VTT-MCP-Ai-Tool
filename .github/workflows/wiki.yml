name: Wiki

# The GM and player wiki (D-097 decision 5): MkDocs Material built from docs/gm and docs/player,
# the same markdown as the dashboard help, with the GM coach zip as a download. Its own workflow,
# not a ci.yml job, so docs merges and code merges stay apart.
#
# Every run builds the site with --strict (a broken link or anchor fails it) and keeps it as the
# artifact `wiki-site`. Publishing to GitHub Pages runs only on main and only once the repository
# variable WIKI_PAGES is "true" (set after the user's OK, with Settings, Pages, Source: GitHub
# Actions).
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'docs/gm/**'
      - 'docs/player/**'
      - 'docs/wiki/**'
      - 'docs/images/**'
      - 'tools/gm-coach/**'
      - 'scripts/wiki/**'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/wiki/requirements.txt

      - name: Install MkDocs (pinned)
        run: python -m pip install -r docs/wiki/requirements.txt

      # The stage script and the coach build use only Node's own modules: no npm ci needed.
      - name: Test the stage script
        run: node --test scripts/wiki/stage.test.mjs

      - name: Stage the pages and the GM coach zip
        run: node scripts/wiki/stage.mjs

      - name: Build the site (strict)
        run: python -m mkdocs build --strict -f build/wiki/mkdocs.yml

      - name: Keep the site
        uses: actions/upload-artifact@v4
        with:
          name: wiki-site
          path: build/wiki/site
          retention-days: 30

      - name: Hand the site to Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.WIKI_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/wiki/site

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.WIKI_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

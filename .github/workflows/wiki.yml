name: Wiki

# The GM and player wiki (D-097 decision 5): MkDocs Material built from docs/gm and docs/player,
# the same markdown as the dashboard help, with the GM coach zip as a download. Its own workflow,
# not a ci.yml job, so docs merges and code merges stay apart.
#
# Every run builds the site with --strict (a broken link or anchor fails it) and keeps it as the
# artifact `wiki-site`. Publishing to GitHub Pages runs only on main (a push or a manual run)
# and only once the repository variable WIKI_PAGES is "true" (set after the user's OK, with
# Settings, Pages, Source: GitHub Actions).
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'docs/gm/**'
      - 'docs/player/**'
      - 'docs/wiki/**'
      - 'docs/images/**'
      - 'tools/gm-coach/**'
      - 'scripts/wiki/**'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-${{ github.ref }}
  # Cancel stale PR runs only; a run on main may be mid-way through a deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/wiki/requirements.txt

      - name: Install MkDocs (pinned)
        run: python -m pip install -r docs/wiki/requirements.txt

      # The stage script and the coach build use only Node's own modules: no npm ci needed for
      # them (only the Storybook steps below install the dashboard's dependencies).
      - name: Test the stage script
        run: node --test scripts/wiki/stage.test.mjs

      - name: Stage the pages and the GM coach zip
        run: node scripts/wiki/stage.mjs

      - name: Build the site (strict)
        run: python -m mkdocs build --strict -f build/wiki/mkdocs.yml

      # Storybook for the React dashboard (UI-03), published next to the wiki under /storybook/.
      # It is a development aid, so a failure in these steps must not stop the wiki: they only
      # warn, and the site goes out without it. It is added after the strict MkDocs build, so the
      # wiki's own link check never sees it.
      - name: Storybook, install the dashboard's dependencies
        id: storybook-install
        continue-on-error: true
        run: npm ci --ignore-scripts --no-audit --no-fund -w @gnuminator/cogm-dashboard

      - name: Storybook, build
        id: storybook-build
        if: steps.storybook-install.outcome == 'success'
        continue-on-error: true
        run: npm run build-storybook -w @gnuminator/cogm-dashboard

      - name: Storybook, add it to the site
        run: |
          if [ -f packages/cogm-dashboard/storybook-static/index.html ]; then
            cp -r packages/cogm-dashboard/storybook-static build/wiki/site/storybook
            echo "Storybook added at /storybook/"
          else
            echo "::warning::Storybook did not build; the wiki goes out without /storybook/."
          fi

      - name: Keep the site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wiki-site
          path: build/wiki/site
          retention-days: 30

      - name: Hand the site to Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.WIKI_PAGES == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: build/wiki/site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.WIKI_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

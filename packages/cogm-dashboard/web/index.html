<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Foundry AI Tool</title>
    <!-- The stylesheets and themes (The Veil, D-085) are bundled by Vite (src/styles/index.css).
         The favicons are served by the dashboard from public/. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  </head>
  <body>
    <div id="root"></div>
    <!-- The usage log (I-084), shared with the player pages; it reads data-track on clicks. The
         server forces the dashboard surface for GM tokens anyway. -->
    <script
      src="/usage.js"
      data-usage-endpoint="/api/usage"
      data-usage-surface="dashboard"
      data-usage-token-key="cogm_token"
    ></script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>

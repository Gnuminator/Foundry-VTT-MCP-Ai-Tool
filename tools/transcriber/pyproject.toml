[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fvtt-transcriber"
version = "0.1.0"
description = "Per-speaker transcription (faster-whisper, optional hviske/saga) for the Foundry AI Tool session pipeline, built to run in Docker."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
# The heavy dependencies are pinned in requirements.txt and installed by the Dockerfile.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
transcribe = "fvtt_transcriber.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
